experiment:
  methods:
    - portfolio_v51_rc2
  seeds: [0, 1, 2]
  budget: 100
  budget_per_dimension: 20
  initial_samples: 10
  initial_samples_per_dimension: 2
  shared_initial_design: sobol
  candidate_pool_size: 2048
  output_dir: results/synthetic_bbob_portfolio_v51_rc2_targeted

benchmark_suite:
  bbob:
    # Regression set: V5.1 Stage-1 strong gains (f12/f14/f16) plus weak-global
    # cases where the over-restrictive exploration gate regressed (f20/f22/f24).
    functions: [12, 14, 16, 20, 22, 24]
    dimensions: [5, 10]
    instances: [1]

optimizer:
  options:
    surrogate: gaussian_process
    noise_level: 1.0e-6
    rule_policy:
      mode: portfolio_v5
      landscape_weight: 0.25
      geometry_weight: 0.30
      candidate_weight: 0.30
      history_weight: 0.15
      temperature: 0.20
  method_options:
    portfolio_v51_rc2:
      base_method: wmbo_rule
  wmbo_control:
    candidate_options_per_strategy: 3
    hypothesis_alignment_weight: 0.15
    information_gain_weight: 0.35
    gp_verifier_enabled: true
    gp_verifier_min_score_ratio: 0.75
    gp_verifier_duplicate_distance: 0.0001

execution:
  continue_on_error: true
  resume: true
  workers: 8

reporting:
  bootstrap_samples: 10000
  confidence_level: 0.95
  regret_floor: 1.0e-12

logging:
  verbose: true
