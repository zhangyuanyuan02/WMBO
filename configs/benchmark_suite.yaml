experiment:
  budget: 30
  seeds: [0]
  methods:
    - random
    - sobol
    - bo_ei
    - bo_pi
    - bo_lcb
    - simple_es
    - wmbo
  initial_samples: 5
  candidate_pool_size: 2048
  output_dir: results/benchmark_suite

optimizer:
  options: {}

benchmark_suite:
  benchmarks:
    - branin
    - hartmann3
    - hartmann6
    - ackley5
    - rastrigin5
    - rosenbrock3
    - levy5
    - griewank5
    - styblinski5

llm:
  enabled: true
  provider: siliconflow
  fallback_to_rule: true

logging:
  verbose: true

wmbo:
  candidate_options_per_strategy: 5
  hypothesis_alignment_weight: 0.15
  information_gain_weight: 0.35
  hypothesis_support_probability: 0.80
  hypothesis_rejection_probability: 0.20
  hypothesis_support_likelihood_ratio: 3.0
  hypothesis_failure_likelihood_ratio: 0.50
  hypothesis_min_relevant_evidence: 1
  gp_verifier_enabled: true
  gp_verifier_min_score_ratio: 0.75
  gp_verifier_duplicate_distance: 0.0001
  multimodal_explore_interval: 4
  multimodal_explore_uncertainty_threshold: 0.30
  multimodal_late_explore_uncertainty_threshold: 0.45
