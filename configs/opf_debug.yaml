experiment:
  methods: [random, bo_ei, wmbo]
  seeds: [0]
  budget: 12
  initial_samples: 4
  candidate_pool_size: 128
  output_dir: results/opf_debug

benchmark_suite:
  benchmarks:
    - opf_pglib_case14_typ_pgvg

optimizer:
  options:
    surrogate: gaussian_process
    constraint_handling: auto
    constraint_pof_floor: 0.05
    constraint_failure_ratio: 1000000.0

evaluation:
  opf:
    penalty_weight: 100.0
    failure_penalty: 1000000.0
    feasibility_tolerance: 0.00001
    backend:
      julia_executable: julia
      timeout_seconds: 30
      startup_timeout_seconds: 180
      warmup: true

llm:
  enabled: false

logging:
  verbose: true
